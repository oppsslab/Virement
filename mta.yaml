_schema-version: "3.1"
ID: virement
version: 1.0.0
description: A simple CAP project.

parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
  subdomain: epf-ent-cf-ap11-dev

build-parameters:
  before-all:
    - builder: custom
      commands:
        - rm -rf build/dist
        - mkdir -p build/dist
        - rm -rf build/ui-deployer
        - mkdir -p build/ui-deployer
    - builder: custom
      commands:
        - npm install --production
        - >-
          bash -c "cds -v | grep 'cds-dk' || npm i --production --no-save @sap/cds-dk"
        - bash -c "export PATH=$PATH:$(pwd)/node_modules/.bin"
        - cds build --production
  after-all:
    - builder: custom
      commands:
        - npm install

modules:
  # ============================================================
  # UI5 APPLICATION
  # ============================================================

  - name: virement-virement.zuippsvirement
    type: html5
    path: app/virement.zui_pps_virement
    build-parameters:
      builder: custom
      commands:
        - rm -rf dist-zip dist
        - npm install
        - >-
          npx -p @ui5/cli@^3.0.0 ui5 build --dest dist --include-task=generateCachebusterInfo
        - mkdir dist-zip
        - >-
          bash -c "cd dist && npx bestzip ../dist-zip/virementzuippsvirement.zip *"
      _artifactName: virementzuippsvirement.zip
      supported-platforms: []
      build-result: dist-zip

  # ============================================================
  # HANA DATABASE DEPLOYER
  # ============================================================

  - name: virement-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm
      ignore:
        - node_modules
        - package-lock.json
    requires:
      - name: virement-service-uaa
      - name: virement-service-db

  # ============================================================
  # CAP BACKEND SERVICE
  # Incoming authentication is handled through XSUAA.
  # IAS remains bound for AMS initialization and authorization.
  # ============================================================

  - name: virement-srv
    type: nodejs
    path: gen/srv
    parameters:
      memory: 2GB
      routes:
        - route: "${default-url}"
        - route: "${default-host}.cert.${default-domain}"
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
          srv-cert-url: "${protocol}://${default-host}.cert.${default-domain}"
    build-parameters:
      builder: npm
      ignore:
        - node_modules
        - package-lock.json
    requires:
      - name: virement-service-uaa
      - name: virement-service-db
      - name: virement-service-destination
      - name: virement-service-metadata
      - name: shared-connectivity
      - name: shared-logs
      - name: virement-ias
        parameters:
          config:
            credential-type: X509_GENERATED
            app-identifier: srv
            validity: 365
      - name: virement-dms
    deployed-after:
      - virement-ams-policies-deployer
    properties:
      AMS_DCL_ROOT: ams/dcl

  # ============================================================
  # SUBACCOUNT DESTINATION CONTENT DEPLOYER
  # The backend destinations use XSUAA OAuth2UserTokenExchange.
  # Do not use the identity service as TokenServiceInstanceName.
  # ============================================================

  - name: virement-aux-destinations
    type: com.sap.application.content
    parameters:
      content:
        subaccount:
          existing_destinations_policy: update
          destinations:
            # XSUAA service destination
            - Name: virement-service-uaa
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: virement-uaa
              ServiceKeyName: virement-uaa-key
              sap.cloud.service: lcap.virement

            # General CAP backend destination
            - Name: virement-app-srv
              Authentication: OAuth2UserTokenExchange
              TokenServiceInstanceName: virement-uaa
              TokenServiceKeyName: virement-uaa-key
              URL: ~{srv-api/srv-url}
              HTML5.DynamicDestination: true
              sap.cloud.service: lcap.virement

            # HTML5 Applications Repository destination
            # Authentication is derived from the referenced service key.
            - Name: virement-service-html5-apps-repo-host
              ServiceInstanceName: virement-html5-apps-repo-host
              ServiceKeyName: virement-html5-apps-repo-host-key
              sap.cloud.service: lcap.virement

            # CAP OData service destination
            - Name: virement-ZSVC_PPS_VIREMENT
              Authentication: OAuth2UserTokenExchange
              TokenServiceInstanceName: virement-uaa
              TokenServiceKeyName: virement-uaa-key
              URL: ~{srv-api/srv-url}/service/ZSVC_PPS_VIREMENT
              sap.cloud.service: lcap.virement
              sap.applicationdevelopment.actions.enabled: false
              sap.build.usage: CAP
              # Enabled so SAP Build Process Automation can use this
              # destination as an API source (e.g. for getApprovers,
              # assignApprovers) - it was previously disabled here,
              # which is why it never showed up as a usable API
              # source and a separate ad-hoc "virement-backend"
              # destination had to be created instead.
              sap.processautomation.enabled: true
              HTML5.DynamicDestination: true
              WebIDEEnabled: false
              MobileEnabled: false
              AppgyverEnabled: false
    build-parameters:
      no-source: true
    requires:
      - name: virement-service-uaa
        parameters:
          service-key:
            name: virement-uaa-key
      - name: srv-api
      - name: virement-service-html5-apps-repo-host
        parameters:
          service-key:
            name: virement-html5-apps-repo-host-key
      - name: virement-service-destination
        parameters:
          content-target: true

  # ============================================================
  # LAUNCHPAD HTML5 APPLICATION
  # ============================================================

  - name: virement-launchpad
    type: html5
    path: build/launchpad
    build-parameters:
      builder: custom
      commands:
        - npm install
        - >-
          npx -p @ui5/cli@^3.0.0 ui5 build --dest dist --include-task=generateCachebusterInfo
        - bash -c "cd dist && npx bestzip ../../../build/dist/launchpad.zip *"
        - rm -rf dist
      _artifactName: launchpad.zip
      supported-platforms: []
      build-result: ../../build/dist

  # ============================================================
  # HTML5 CONTENT DEPLOYER
  # ============================================================

  - name: virement-aux-ui-deployer
    type: com.sap.application.content
    path: build/ui-deployer
    build-parameters:
      build-result: resources
      requires:
        - name: virement-virement.zuippsvirement
          artifacts:
            - virementzuippsvirement.zip
          target-path: resources
        - name: virement-launchpad
          artifacts:
            - launchpad.zip
          target-path: resources
    requires:
      - name: virement-service-html5-apps-repo-host
        parameters:
          content-target: true

  # ============================================================
  # AMS POLICY DEPLOYER
  # Deploys generated DCL policies using the IAS/AMS binding.
  # ============================================================

  - name: virement-ams-policies-deployer
    type: javascript.nodejs
    path: gen/policies
    parameters:
      memory: 256M
      buildpack: nodejs_buildpack
      no-route: true
      no-start: true
      tasks:
        - name: deploy-dcl
          command: npm start
          memory: 256M
    requires:
      - name: virement-ias
        parameters:
          config:
            credential-type: X509_GENERATED
            app-identifier: ams-policy-deployer
            validity: 365

# ==============================================================
# RESOURCES
# ==============================================================

resources:
  # ============================================================
  # XSUAA SERVICE
  # Used by Work Zone, HTML5 routing, and backend token exchange.
  # ============================================================

  - name: virement-service-uaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      service-name: virement-uaa
      path: xs-security.json
      config:
        oauth2-configuration:
          redirect-uris:
            - https://${subdomain}.launchpad.${default-domain}/login/*
            - https://${subdomain}.${default-domain}/login/*
          credential-types:
            - binding-secret
            - x509
        xsappname: virement-${space}
        role-collections:
          - description: REQUEST_APPROVE
            name: virement-REQUEST_APPROVE-${space}
            role-template-references:
              - $XSAPPNAME.REQUEST_APPROVE
          - description: VR_ADMIN
            name: virement-VR_ADMIN-${space}
            role-template-references:
              - $XSAPPNAME.VR_ADMIN

  # ============================================================
  # HANA HDI CONTAINER
  # ============================================================

  - name: virement-service-db
    type: org.cloudfoundry.managed-service
    parameters:
      service: hana
      service-plan: hdi-shared
      service-name: virement-db

  # ============================================================
  # SHARED DESTINATION SERVICE
  # Receives the subaccount-level destination content.
  # ============================================================

  - name: virement-service-destination
    type: org.cloudfoundry.existing-service

  # ============================================================
  # METADATA USER-PROVIDED SERVICE
  # ============================================================

  - name: virement-service-metadata
    type: org.cloudfoundry.user-provided-service
    parameters:
      service: metadata
      service-plan: standard
      service-name: virement-metadata
      config:
        default-domain: ${default-domain}

  # ============================================================
  # SHARED CONNECTIVITY SERVICE
  # ============================================================

  - name: shared-connectivity
    type: org.cloudfoundry.existing-service

  # ============================================================
  # SHARED LOGGING SERVICE
  # ============================================================

  - name: shared-logs
    type: org.cloudfoundry.existing-service

  # ============================================================
  # HTML5 APPLICATIONS REPOSITORY
  # ============================================================

  - name: virement-service-html5-apps-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
      service-name: virement-html5-apps-repo-host

  # ============================================================
  # SAP CLOUD IDENTITY SERVICE WITH AMS ENABLED
  # Retained for AMS initialization and DCL policy deployment.
  # ============================================================

  - name: virement-ias
    type: org.cloudfoundry.managed-service
    parameters:
      service: identity
      service-name: virement-ias
      service-plan: application
      config:
        provided-apis:
          - name: virement-ias-api
            description: API exposed by the application
        display-name: virement
        oauth2-configuration:
          token-policy:
            access-token-format: jwt
          redirect-uris:
            - https://${subdomain}.launchpad.${default-domain}/login/*
            - https://${subdomain}.${default-domain}/login/*
        authorization:
          enabled: true
        xsuaa-cross-consumption: true

  # ============================================================
  # DOCUMENT MANAGEMENT SERVICE
  # ============================================================

  - name: virement-dms
    type: org.cloudfoundry.existing-service
